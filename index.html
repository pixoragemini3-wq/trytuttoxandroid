    <style>
      :root {
        --red: #e31b23;
        --dark: #111111;
        --bg: #f4f4f4;
        --card: #ffffff;
        --text: #111111;
        --muted: #6b7280;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--red); }

      ::selection { background: var(--red); color: #fff; }
      
      /* Preserve Blogger specific formatting */
      .prose span[style*="background-color"], 
      .prose span[style*="background"] {
        padding: 2px 4px;
        border-radius: 2px;
        display: inline !important;
      }
      
      /* Ensure inline styles for font-weight, color, and font-size are respected */
      .prose [style*="font-weight"],
      .prose [style*="color"],
      .prose [style*="font-size"] {
        display: inline !important;
        max-width: 100%;
      }
      
      /* Force centered alignment for Blogger image containers */
      .prose .separator,
      .prose div[style*="text-align: center"],
      .prose div[style*="text-align:center"],
      .prose p[style*="text-align: center"],
      .prose p[style*="text-align:center"],
      .prose .tr-caption-container {
        text-align: center !important;
        display: block !important;
        margin-left: auto !important;
        margin-right: auto !important;
        width: fit-content !important;
        max-width: 100% !important;
      }

      .prose .separator img,
      .prose div[style*="text-align: center"] img,
      .prose p[style*="text-align: center"] img {
        margin-left: auto !important;
        margin-right: auto !important;
      }

      /* Handle floated images from Blogger */
      .prose img[style*="float: left"],
      .prose img[style*="float:left"],
      .prose .separator[style*="float: left"],
      .prose .separator[style*="float:left"] {
        float: left !important;
        margin-right: 1.5rem !important;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
        max-width: 50% !important;
      }

      .prose img[style*="float: right"],
      .prose img[style*="float:right"],
      .prose .separator[style*="float: right"],
      .prose .separator[style*="float:right"] {
        float: right !important;
        margin-left: 1.5rem !important;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
        max-width: 50% !important;
      }

      .prose p {
        margin-bottom: 1rem !important;
        line-height: 1.7 !important;
        font-size: 1.02rem;
        color: #1f2937;
      }
      
      .prose img {
        border-radius: 0.65rem;
        margin: 1.5rem auto !important;
        display: block;
        max-width: 100% !important;
        height: auto !important;
        box-shadow: 0 6px 16px -6px rgba(0,0,0,0.07);
        transition: transform 0.2s ease;
      }
      /* Respect Blogger editor alignment (center by default if not explicitly set left/right via preserved styles) */
      .prose img[style*="float: left"],
      .prose img[style*="float:left"] {
        float: left !important;
        margin-right: 1rem !important;
        margin-left: 0 !important;
        display: inline !important;
      }
      .prose img[style*="float: right"],
      .prose img[style*="float:right"] {
        float: right !important;
        margin-left: 1rem !important;
        margin-right: 0 !important;
        display: inline !important;
      }
      /* If a parent wrapper has explicit left/right/center from Blogger, let it win; default images are centered via margin auto above */
      .prose img:hover {
        transform: scale(1.01);
      }

      /* Modern 2026 editorial base */
      .prose h2, .prose h3 {
        font-family: 'Saira Extra Condensed', sans-serif;
        letter-spacing: -0.5px;
      }

      .prose .separator a {
        display: inline-block;
        margin: 0 auto;
      }

      .prose .tr-caption-container {
        margin: 1.5rem auto;
        text-align: center;
        background: #f9f9f9;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.85em;
        color: #666;
        max-width: 100%;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
      }

      .prose .tr-caption {
        margin-top: 8px;
        display: block;
      }

      /* Fix for aseptic text: ensure bold and italic are visible */
      .prose strong, .prose b {
        font-weight: 800 !important;
        color: #000 !important;
      }

      .prose h1, .prose h2, .prose h3, .prose h4 {
        font-weight: 800 !important;
        color: #111 !important;
        font-family: 'Saira Extra Condensed', sans-serif !important;
        text-transform: uppercase;
        margin-top: 2.5rem !important;
        margin-bottom: 1.25rem !important;
      }

      .prose h1 { font-size: 2.25rem !important; line-height: 1.1 !important; margin-top: 2rem !important; }
      .prose h2 { font-size: 1.875rem !important; line-height: 1.15 !important; margin-top: 1.75rem !important; }
      .prose h3 { font-size: 1.5rem !important; line-height: 1.2 !important; margin-top: 1.5rem !important; }

      /* List Styling */
      .prose ul, .prose ol {
        margin-top: 1.5rem !important;
        margin-bottom: 1.5rem !important;
        padding-left: 1.5rem !important;
      }
      .prose ul {
        list-style-type: disc !important;
      }
      .prose ol {
        list-style-type: decimal !important;
      }
      .prose li {
        margin-bottom: 0.75rem !important;
        line-height: 1.6 !important;
      }
      .prose li::marker {
        color: #e31b23 !important;

      }

      /* Legacy font size support */
      .prose font[size="1"] { font-size: 0.75rem !important; }
      .prose font[size="2"] { font-size: 0.875rem !important; }
      .prose font[size="3"] { font-size: 1rem !important; }
      .prose font[size="4"] { font-size: 1.25rem !important; }
      .prose font[size="5"] { font-size: 1.5rem !important; }
      .prose font[size="6"] { font-size: 2rem !important; }
      .prose font[size="7"] { font-size: 3rem !important; }

      .prose em, .prose i {
        font-style: italic !important;
      }

      .font-condensed {
        font-family: 'Saira Extra Condensed', 'Impact', 'Arial Narrow', 'Arial Black', system-ui, sans-serif !important;
        font-weight: 900 !important;
      }
      /* Stronger force for the yellow sidebar "BEST OF THE BEST" titles to match local exactly */
      .font-condensed.text-\[3\.5rem\],
      .font-condensed.text-\[2xl\] {
        font-family: 'Saira Extra Condensed', 'Impact', 'Arial Narrow', 'Arial Black', system-ui, sans-serif !important;
        font-weight: 900 !important;
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Shake Animation */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }

      /* Spinner Animation */
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #e31b23;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      /* --- EXPANDABLE ROW (Accordion/Cascata) FIXED --- */
      /* Generic container for both TR and DIV implementations */
      .expandable-row {
          cursor: pointer;
          display: block; 
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 1px 2px rgba(0,0,0,0.04);
          overflow: hidden;
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
          border: 1px solid #f3f4f6;
          margin-bottom: 8px;
          position: relative;
      }
      
      /* Specific override for TABLE rows to behave like cards */
      tr.expandable-row {
          width: 100%;
      }
      tr.expandable-row td {
          display: block;
          width: 100%;
          border: none;
          padding: 0;
      }

      .expandable-row:hover {
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transform: translateY(-1px);
        border-color: #ddd;
      }

      /* Title Area - premium 2026, elegant and readable */
      .expandable-row > td:first-child,
      .expandable-row > .expandable-title,
      .expandable-row > div:first-child:not(.expandable-description) {
          display: block;
          padding: 14px 38px 14px 16px;
          font-weight: 600;
          color: #111827;
          position: relative;
          font-family: 'Inter', sans-serif;
          font-size: 15px;
          line-height: 1.4;
          letter-spacing: -0.15px;
          background: white;
      }

      /* Green Accent Bar (Visual Flair from screenshot) */
      .expandable-row::before {
          content: '';
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 4px;
          background: #c0ff8c; /* Tech Green */
          opacity: 0;
          transition: opacity 0.2s;
      }
      .expandable-row:hover::before,
      .expandable-row.expanded::before {
          opacity: 1;
      }

      /* Arrow indicator */
      .expandable-row > td:first-child::after,
      .expandable-row > .expandable-title::after,
      .expandable-row > div:first-child:not(.expandable-description)::after {
          content: '▼';
          position: absolute;
          right: 18px;
          top: 50%;
          transform: translateY(-50%);
          font-size: 11px;
          color: #888;
          transition: transform 0.3s ease, color 0.3s;
      }

      /* Expanded State Styles */
      .expandable-row.expanded > td:first-child,
      .expandable-row.expanded > .expandable-title,
      .expandable-row.expanded > div:first-child:not(.expandable-description) {
          color: #e31b23;
          background-color: #fff; /* Keep white for cleaner look */
      }
      
      .expandable-row.expanded > td:first-child::after,
      .expandable-row.expanded > .expandable-title::after,
      .expandable-row.expanded > div:first-child:not(.expandable-description)::after {
          transform: translateY(-50%) rotate(180deg);
          color: #e31b23;
      }

      /* Description / Content Area - premium 2026, elegant and readable */
      .expandable-description {
          display: block;
          overflow: hidden;
          max-height: 0;
          opacity: 0;
          transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
          background-color: #f8fafc;
          font-size: 15px;
          line-height: 1.65;
          color: #334155;
          padding: 0 18px;
          border-top: 1px solid #e2e8f0;
      }
      
      /* When description is descendant of the row (original pattern) */
      .expandable-row.expanded .expandable-description {
          max-height: 2800px; 
          opacity: 1;
          padding: 18px 18px 24px;
          border-top: 1px solid #cbd5e1;
      }

      /* When description is immediate next sibling (common in Blogger table/div cascata) */
      .expandable-row.expanded + .expandable-description,
      .expandable-description.expanded {
          max-height: 2800px; 
          opacity: 1;
          padding: 18px 18px 22px;
          border-top: 1px solid #eee;
      }

      /* --- TABLE OF CONTENTS (ToC) --- */
      .table-of-contents {
          background: #f8f9fa;
          border-left: 4px solid #e31b23;
          padding: 20px;
          margin: 20px 0;
          border-radius: 0 8px 8px 0;
      }
      .table-of-contents h2, .table-of-contents h3 {
          font-family: 'Saira Extra Condensed', sans-serif;
          text-transform: uppercase;
          font-weight: 800;
          font-size: 18px;
          margin-bottom: 10px;
          color: #222;
      }
      .table-of-contents ul {
          list-style: none;
          padding: 0;
          margin: 0;
      }
      .table-of-contents li {
          margin-bottom: 8px;
          position: relative;
          padding-left: 15px;
      }
      .table-of-contents li::before {
          content: '•';
          color: #e31b23;
          position: absolute;
          left: 0;
          font-weight: bold;
      }
      .table-of-contents a {
          text-decoration: none;
          color: #555;
          font-weight: 500;
          font-size: 14px;
          transition: color 0.2s;
      }
      .table-of-contents a:hover {
          color: #e31b23;
          text-decoration: underline;
      }

      /* --- COPY CODE BUTTON --- */
      .copy-code-btn {
          position: absolute;
          top: 5px;
          right: 5px;
          background: #333;
          color: white;
          border: none;
          border-radius: 4px;
          padding: 4px 10px;
          font-size: 12px;
          font-family: sans-serif;
          cursor: pointer;
          opacity: 0.7;
          transition: opacity 0.2s, background 0.2s;
          z-index: 10;
      }
      .copy-code-btn:hover {
          opacity: 1;
          background: #e31b23;
      }
      .copy-code-btn.copied {
          background: #22c55e;
      }
      pre {
          position: relative;
      }
